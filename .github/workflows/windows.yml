name: Windows test and portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e '.[gui,dev]'
      - run: python -m pytest -v --junitxml=artifacts/tests.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build.py
      - run: python scripts/smoke_artifacts.py --bundle dist/portable/CLA-0.1.0-windows-x64 --output artifacts/frozen-smoke.json
      - run: python scripts/smoke_wheel.py --wheel dist/release/codex_launcher_awarness-0.1.0-py3-none-any.whl --output artifacts/wheel-smoke.json
      - run: python scripts/acceptance_frozen_launch.py --cla dist/portable/CLA-0.1.0-windows-x64/cla.exe --powershell (Get-Command pwsh.exe).Source --allow-elevated
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-windows-build
          path: |
            dist/release/
            artifacts/
# No package-index publication or automatic GitHub release is configured.
