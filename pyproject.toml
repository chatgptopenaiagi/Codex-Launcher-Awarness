[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-launcher-awarness"
version = "0.1.0"
description = "Experimental Windows workstation evidence, briefing, and Codex launcher"
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
dependencies = ["mcp>=1.30,<2", "pydantic>=2.12,<3", "psutil>=7,<8", "platformdirs>=4,<5", "tomlkit>=0.13,<1", "httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
gui = ["PySide6>=6.10,<7"]
dev = ["pytest>=9,<10", "pytest-qt>=4,<5", "pytest-timeout>=2,<3", "build>=1,<2", "pyinstaller>=6.16,<7"]

[project.scripts]
cla = "codex_launcher_awarness.cli:main"
cla-mcp = "codex_launcher_awarness.mcp.server:main"

[project.gui-scripts]
CLA-Launcher = "codex_launcher_awarness.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_launcher_awarness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "scripts", "packaging", ".github", "pyproject.toml", "README.md", "AGENTS.md", "SECURITY.md", "CHANGELOG.md", "LICENSE-PENDING.md", "THIRD-PARTY-NOTICES.md", "requirements-lock.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 90
markers = ["windows: needs Windows", "gui: Qt GUI tests", "integration: subprocess integration tests"]
